<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>SladkaЯ жизнь</title>
<meta name="description" content="Приложение самоконтроля диабета 1 типа: мониторинг глюкозы, углеводы, инсулин, метрики.">
<meta name="theme-color" content="#161826">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SugarLife">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="nocturne.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<style>@keyframes sheetUp { from { transform: translateY(101%); } to { transform: translateY(0); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
* { -webkit-tap-highlight-color: transparent; }
a { color: var(--color-accent-300); }
a:hover { color: var(--color-accent); }
.noscroll { scrollbar-width: none; -ms-overflow-style: none; }
.noscroll::-webkit-scrollbar { display: none; width: 0; height: 0; }
html, body { height: 100%; }
body { margin: 0; overflow: hidden; background: var(--color-bg); overscroll-behavior: none; }
#root { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--color-bg); color: var(--color-text);
  padding-top: env(safe-area-inset-top);
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right); }
#root > div { flex: 1; min-height: 0; }
/* Десктоп/крупный экран с мышью — приложение колонкой по центру «стола».
   Сенсорные устройства (телефоны/планшеты) всегда на весь экран. */
@media (min-width: 700px) and (pointer: fine) {
  body { background: var(--c-desk); display: flex; align-items: center; justify-content: center; }
  #root {
    position: relative; inset: auto; padding: 0;
    width: 402px; height: 100dvh; max-height: 874px;
    border-radius: 22px; overflow: hidden;
    box-shadow: 0 0 0 1px var(--color-neutral-800), 0 24px 60px rgba(0,0,0,.45);
  }
}
</style>
<style>
:root{--c-glu:#93c79b;--c-glu-2:#8bb890;--c-glu-3:#6f9e79;--c-carb:#e0b64f;--c-carb-2:#d8b463;--c-carb-3:#c1953f;--c-ins:#63c0cc;--c-ins-2:#5aa9b4;--c-ins-3:#3f8b97;--c-act:#a99ee6;--c-act-3:#6d5fb8;--c-danger:#c96b7a;--c-danger-2:#d98a96;--c-trend:#b0713d;--c-trend-2:#a8683a;--c-scrim:#05060c;--c-avatar-bg:#efedf7;--c-avatar-fg:#2a2350;--c-desk:#0c0d16}
[data-theme="light"]{--color-bg:#f4f4f8;--color-text:#14151c;--color-neutral-900:#ffffff;--color-neutral-800:#e5e5ef;--color-neutral-700:#cfcfdc;--color-neutral-600:#a2a2b4;--color-neutral-500:#7c7c8e;--color-neutral-400:#5f5f76;--color-neutral-300:#3f3f56;--color-neutral-100:#1b1c26;--color-accent:#6152c8;--color-accent-300:#4a3ea6;--c-glu:#3f8b56;--c-glu-2:#5aa06d;--c-glu-3:#7fbd8f;--c-carb:#a97b16;--c-carb-2:#c39533;--c-carb-3:#d8b463;--c-ins:#1f7f8c;--c-ins-2:#3f97a3;--c-ins-3:#7cc0c9;--c-act:#6152c8;--c-act-3:#9a8ee0;--c-danger:#b44a5c;--c-danger-2:#9c3b4d;--c-trend:#9a5f2e;--c-trend-2:#c08a56;--c-scrim:#2f3040;--c-avatar-bg:#e7e5f5;--c-avatar-fg:#2a2350;--c-desk:#e9e9f0}
</style>
</head>
<body>
<div id="root" data-theme="dark"></div>
<template id="tpl">

    <div style="height:100%;position:relative;overflow:hidden;display:flex;flex-direction:column;background:var(--color-bg);color:var(--color-text)">

      <!-- ================= ВЕРХНИЙ БЛОК (живёт на всех экранах) ================= -->
      <div style="flex-shrink:0;padding:{{ headPad }} 20px 0">

        <sc-if value="{{ isToday }}" hint-placeholder-val="{{ true }}">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:22px">
            <div style="display:flex;align-items:center;gap:6px;color:var(--color-neutral-400);font-size:12px">
              <i class="ph-fill ph-heart" style="color:var(--c-danger);font-size:14px"></i>
              <span>{{ syncedText }}</span>
            </div>
            <button type="button" onClick="{{ toggleTheme }}" aria-label="Тема" style="width:34px;height:34px;border-radius:50%;border:1px solid var(--color-neutral-800);background:var(--color-neutral-900);color:var(--color-neutral-300);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0" style-hover="border-color:var(--color-accent);color:var(--color-text)">
              <i class="{{ themeIcon }}" style="font-size:15px"></i>
            </button>
          </div>
        </sc-if>

        <!-- ryad: pryamougolnik + krug v centre = tri knopki -->
        <div style="position:relative;height:{{ rowH }};transition:height .22s cubic-bezier(.3,.9,.3,1)">

          <!-- pryamougolnik s dvumya knopkami -->
          <div style="position:absolute;left:0;right:0;top:{{ rectTop }};height:{{ rectH }};display:flex;border-radius:20px;overflow:hidden;border:1.5px solid color-mix(in srgb, var(--color-accent) 55%, transparent);background:linear-gradient(180deg, color-mix(in srgb, var(--color-accent) 14%, transparent), color-mix(in srgb, var(--color-accent) 4%, transparent));transition:height .22s cubic-bezier(.3,.9,.3,1), top .22s cubic-bezier(.3,.9,.3,1)">

            <!-- knopka 1: NMG -->
            <button type="button" data-om-label="nmg" onClick="{{ openMon }}" style="flex:1;min-width:0;display:flex;flex-direction:{{ wingDir }};justify-content:center;align-items:{{ wingAlignL }};gap:{{ wingGap }};padding:0 20px 0 18px;background:transparent;border:0;cursor:pointer;font-family:var(--font-body);text-align:left;transition:background .16s" style-hover="background:color-mix(in srgb, var(--color-accent) 12%, transparent)" style-active="background:color-mix(in srgb, var(--color-accent) 20%, transparent)">
              <i class="{{ monIcon }}" style="font-size:{{ icoS }};color:var(--color-accent)"></i>
              <div style="display:flex;align-items:center;gap:5px">
                <div style="font-size:{{ nameS }};font-weight:600;color:var(--color-text)">{{ monLabel }}</div>
                <div style="display:{{ monBadgeShow }};align-items:center;gap:3px;padding:2px 6px;border-radius:7px;background:color-mix(in srgb, var(--c-glu) 18%, transparent)">
                  <div style="width:4px;height:4px;border-radius:50%;background:var(--c-glu)"></div>
                  <span style="font-size:9px;font-weight:600;color:var(--c-glu);line-height:1">{{ monBadge }}</span>
                </div>
              </div>
              <sc-if value="{{ full }}" hint-placeholder-val="{{ true }}">
                <div style="font-size:10px;color:var(--color-neutral-400);line-height:1.2">{{ monSub }}</div>
              </sc-if>
              <div style="font-size:{{ valS }};font-weight:600;color:var(--color-text);line-height:1;margin-top:3px">{{ monValue }}</div>
              <sc-if value="{{ full }}" hint-placeholder-val="{{ true }}">
                <div style="font-size:10px;color:var(--color-neutral-400);line-height:1.2">{{ monSub2 }}</div>
              </sc-if>
            </button>

            <!-- mesto pod krug -->
            <div style="width:{{ gapW }};flex-shrink:0"></div>

            <!-- knopka 2: pompa -->
            <button type="button" onClick="{{ openIns }}" style="flex:1;min-width:0;display:flex;flex-direction:{{ wingDir }};justify-content:center;align-items:{{ wingAlignR }};gap:{{ wingGap }};padding:0 18px 0 20px;background:transparent;border:0;cursor:pointer;font-family:var(--font-body);text-align:right;transition:background .16s" style-hover="background:color-mix(in srgb, var(--color-accent) 12%, transparent)" style-active="background:color-mix(in srgb, var(--color-accent) 20%, transparent)">
              <i class="{{ pumpIcon }}" style="font-size:{{ icoS }};color:var(--color-accent)"></i>
              <div style="font-size:{{ nameS }};font-weight:600;color:var(--color-text);margin-top:2px">{{ deviceLabel }}</div>
              <sc-if value="{{ full }}" hint-placeholder-val="{{ true }}">
                <div style="font-size:10px;color:var(--color-neutral-400);line-height:1.2">{{ rapid }}</div>
              </sc-if>
              <div style="font-size:{{ valS }};font-weight:600;color:var(--color-text);line-height:1;margin-top:3px">{{ insulinLeft }}</div>
              <sc-if value="{{ full }}" hint-placeholder-val="{{ true }}">
                <div style="font-size:10px;color:var(--color-neutral-400);line-height:1.2">{{ deviceSub }}</div>
              </sc-if>
            </button>
          </div>

          <!-- knopka 3: krug s saharom -->
          <button type="button" onClick="{{ openGlucose }}" style="position:absolute;left:50%;top:0;transform:translateX(-50%);width:{{ rowH }};height:{{ rowH }};padding:0;border-radius:50%;overflow:hidden;cursor:pointer;font-family:var(--font-body);border:2px solid var(--color-accent);box-shadow:0 0 0 8px var(--color-bg), 0 0 22px color-mix(in srgb, var(--color-accent) 22%, transparent), inset 0 0 30px color-mix(in srgb, var(--color-accent) 16%, transparent);background:radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--color-accent) 14%, transparent), var(--color-bg) 74%);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:box-shadow .16s, width .22s cubic-bezier(.3,.9,.3,1), height .22s cubic-bezier(.3,.9,.3,1)" style-hover="box-shadow:0 0 0 8px var(--color-bg), 0 0 30px color-mix(in srgb, var(--color-accent) 38%, transparent), inset 0 0 30px color-mix(in srgb, var(--color-accent) 22%, transparent)">
            <svg viewBox="0 0 150 150" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;opacity:.35">
              <path d="M0,96 C18,74 34,104 52,86 C72,66 90,100 110,82 C126,68 140,86 150,80" fill="none" style="stroke:var(--color-accent)" stroke-width="2"></path>
            </svg>
            <div style="position:relative;z-index:2;display:flex;flex-direction:column;align-items:center">
              <div style="display:flex;align-items:center;gap:5px">
                <span style="font-size:{{ valueS }};font-weight:600;line-height:1;letter-spacing:-.02em;color:var(--color-text)">{{ glucoseNow }}</span>
                <i class="{{ glucoseArrow }}" style="font-size:{{ arrowS }};color:var(--c-glu)"></i>
              </div>
              <div style="font-size:{{ unitS }};color:var(--color-neutral-300);margin-top:4px;display:{{ unitShow }}">{{ unitLabel }}</div>
              <sc-if value="{{ full }}" hint-placeholder-val="{{ true }}">
                <div style="font-size:10px;color:var(--color-neutral-400);margin-top:5px">{{ glucoseAgo }}</div>
              </sc-if>
            </div>
          </button>

        </div>
      </div>

      <!-- ================= КОНТЕНТ ================= -->
      <div class="noscroll" onScroll="{{ onScroll }}" style="flex:1;overflow:auto">

        <!-- ---------- ЭКРАН «СЕГОДНЯ» ---------- -->
        <sc-if value="{{ isToday }}" hint-placeholder-val="{{ true }}">
          <div style="padding:0 20px 24px">

            <!-- плитка еда / углеводы -->
            <div onClick="{{ openFood }}" style="display:flex;align-items:stretch;border-radius:20px;overflow:hidden;cursor:pointer;border:1.5px solid color-mix(in srgb, var(--c-carb) 55%, transparent);background:linear-gradient(180deg, color-mix(in srgb, var(--c-carb) 14%, transparent), color-mix(in srgb, var(--c-carb) 4%, transparent));margin-top:14px">
              <div style="flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:5px;padding:14px 0 14px 18px">
                <div style="display:flex;align-items:baseline;gap:5px">
                  <span style="font-size:11px;color:var(--color-neutral-400);width:12px">Б</span>
                  <span style="font-size:13px;font-weight:600">62</span>
                  <span style="font-size:10px;color:var(--color-neutral-400)">г</span>                </div>
                <div style="display:flex;align-items:baseline;gap:5px">
                  <span style="font-size:11px;color:var(--color-neutral-400);width:12px">Ж</span>
                  <span style="font-size:13px;font-weight:600">48</span>
                  <span style="font-size:10px;color:var(--color-neutral-400)">г</span>
                </div>
                <div style="display:flex;align-items:baseline;gap:5px">
                  <span style="font-size:11px;color:var(--color-neutral-400);width:12px">У</span>
                  <span style="font-size:13px;font-weight:600">{{ dayCarbs }}</span>
                  <span style="font-size:10px;color:var(--color-neutral-400)">{{ carbUnitLabel }}</span>
                </div>
              </div>

              <div style="flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 10px">
                <div style="display:flex;align-items:baseline;gap:5px">
                  <span style="font-size:40px;font-weight:600;line-height:1;letter-spacing:-.02em;color:var(--c-carb)">{{ activeCarbs }}</span>
                  <span style="font-size:14px;color:var(--c-carb-2)">{{ carbUnitLabel }}</span>
                </div>
                <div style="font-size:11px;color:var(--color-neutral-400);margin-top:5px">активные углеводы</div>
                <div style="font-size:10px;color:var(--color-neutral-500);margin-top:3px">всего за день · {{ dayCarbs }} {{ carbUnitLabel }}</div>
              </div>

              <button type="button" style="flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;gap:4px;padding:14px 18px 14px 0;background:transparent;border:0;cursor:pointer;font-family:var(--font-body);text-align:right;transition:background .16s" style-hover="background:color-mix(in srgb, var(--c-carb) 12%, transparent)" style-active="background:color-mix(in srgb, var(--c-carb) 20%, transparent)">
                <i class="ph-bold ph-fork-knife" style="font-size:24px;color:var(--c-carb)"></i>
                <div style="font-size:14px;font-weight:600;color:var(--color-text)">Еда</div>
                <div style="font-size:10px;color:var(--color-neutral-400);line-height:1.2">4 приёма</div>
              </button>
            </div>

          </div>
        </sc-if>

        <!-- ---------- ЭКРАН «МЕТРИКИ» ---------- -->
        <sc-if value="{{ isMetrics }}" hint-placeholder-val="{{ false }}">
          <div style="padding:20px 20px 24px">

            <!-- период -->
            <div style="display:flex;background:var(--color-neutral-900);border-radius:12px;padding:4px;gap:2px">
              <div style="flex:1;text-align:center;padding:9px 0;border-radius:9px;background:var(--color-neutral-100);color:var(--color-neutral-900);font-size:13px;font-weight:600">3 дня</div>
              <div style="flex:1;text-align:center;padding:9px 0;color:var(--color-neutral-400);font-size:13px">7 дней</div>
              <div style="flex:1;text-align:center;padding:9px 0;color:var(--color-neutral-400);font-size:13px">30 дней</div>
              <div style="flex:1;text-align:center;padding:9px 0;color:var(--color-neutral-400);font-size:13px">90 дней</div>
            </div>

            <!-- переключение метрики -->
            <div class="noscroll" style="display:flex;gap:8px;overflow:auto;margin-top:18px;padding-bottom:2px">
              <sc-for list="{{ metricTabs }}" as="m" hint-placeholder-count="4">
                <div onClick="{{ m.onClick }}" style="flex-shrink:0;display:flex;align-items:center;gap:7px;padding:9px 14px;border-radius:15px;cursor:pointer;background:{{ m.bg }};border:1px solid {{ m.bd }}">
                  <i class="{{ m.icon }}" style="font-size:15px;color:{{ m.dot }}"></i>
                  <span style="font-size:13px;font-weight:500;white-space:nowrap;color:{{ m.col }}">{{ m.label }}</span>
                </div>
              </sc-for>
            </div>

            <div style="display:flex;align-items:center;gap:10px;margin-top:22px">
              <i class="{{ mIcon }}" style="font-size:26px;color:{{ mColor }}"></i>
              <span style="font-size:24px;font-weight:600">{{ mTitle }}</span>
            </div>

            <!-- большая плитка -->
            <div style="position:relative;overflow:hidden;height:170px;border-radius:20px;background:color-mix(in srgb, var(--color-accent) 9%, var(--color-neutral-900));padding:16px;box-sizing:border-box;margin-top:14px">
              <div style="display:flex;align-items:flex-start;justify-content:space-between">
                <div style="font-size:14px;color:var(--color-neutral-300)">{{ mHeroLabel }}</div>
                <i class="ph-bold ph-caret-right" style="font-size:18px;color:var(--color-neutral-300)"></i>
              </div>
              <div style="margin-top:4px;display:flex;align-items:baseline;gap:4px">
                <span style="font-size:42px;font-weight:700;line-height:1">{{ mHeroValue }}</span>
                <span style="font-size:16px;font-weight:500;color:var(--color-neutral-300)">{{ mHeroUnit }}</span>
              </div>
              <svg viewBox="0 0 300 90" preserveAspectRatio="none" style="position:absolute;left:0;right:0;bottom:0;width:100%;height:96px">
                <path d="{{ mHeroArea }}" fill="{{ mColor }}" fill-opacity="0.18"></path>
                <path d="{{ mHeroLine }}" fill="none" stroke="{{ mColor }}" stroke-width="2.5"></path>
              </svg>
            </div>

            <!-- две плитки -->
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px">
              <sc-for list="{{ mCards }}" as="c" hint-placeholder-count="2">
                <div style="position:relative;overflow:hidden;height:150px;border-radius:20px;background:color-mix(in srgb, var(--color-accent) 9%, var(--color-neutral-900));padding:14px;box-sizing:border-box">
                  <div style="display:flex;align-items:flex-start;justify-content:space-between">
                    <span style="font-size:13px;color:var(--color-neutral-300)">{{ c.label }}</span>
                    <i class="ph-bold ph-caret-right" style="font-size:16px;color:var(--color-neutral-300)"></i>
                  </div>
                  <div style="margin-top:4px;display:flex;align-items:baseline;gap:3px">
                    <span style="font-size:32px;font-weight:700;line-height:1">{{ c.value }}</span>
                    <span style="font-size:13px;font-weight:500;color:var(--color-neutral-300)">{{ c.unit }}</span>
                  </div>
                  <svg viewBox="0 0 160 70" preserveAspectRatio="none" style="position:absolute;left:0;right:0;bottom:0;width:100%;height:70px">
                    <path d="{{ c.area }}" fill="{{ mColor }}" fill-opacity="0.16"></path>
                    <path d="{{ c.line }}" fill="none" stroke="{{ mColor }}" stroke-width="2.5"></path>
                  </svg>
                </div>
              </sc-for>
            </div>

            <!-- два показателя -->
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px">
              <sc-for list="{{ mStats }}" as="s" hint-placeholder-count="2">
                <div style="border-radius:20px;background:color-mix(in srgb, var(--color-accent) 9%, var(--color-neutral-900));padding:14px">
                  <div style="display:flex;align-items:flex-start;justify-content:space-between">
                    <span style="font-size:13px;color:var(--color-neutral-300)">{{ s.label }}</span>
                    <i class="ph-bold ph-caret-right" style="font-size:16px;color:var(--color-neutral-300)"></i>
                  </div>
                  <div style="margin-top:8px;display:flex;align-items:baseline;gap:5px">
                    <span style="font-size:32px;font-weight:700;line-height:1">{{ s.value }}</span>
                    <span style="font-size:12px;color:var(--color-neutral-300)">{{ s.unit }}</span>
                  </div>
                </div>
              </sc-for>
            </div>

          </div>
        </sc-if>

        <!-- ---------- ЭКРАН «ПРОФИЛЬ» ---------- -->
        <sc-if value="{{ isProfile }}" hint-placeholder-val="{{ false }}">
          <div style="padding:20px 20px 24px">

            <div style="display:flex;align-items:center;gap:14px">
              <div style="width:64px;height:64px;border-radius:50%;background:var(--c-avatar-bg);display:flex;align-items:center;justify-content:center;flex-shrink:0">
                <i class="ph-fill ph-user" style="font-size:36px;color:var(--c-avatar-fg)"></i>
              </div>
              <div>
                <div style="font-size:22px;font-weight:600;line-height:1.1;letter-spacing:-.01em">Алексей М.</div>
                <div style="font-size:12px;color:var(--color-neutral-400);margin-top:5px">СД 1 типа · с 2014 года</div>
              </div>
            </div>

            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:20px">
              <div style="border-radius:16px;background:color-mix(in srgb, var(--color-accent) 9%, var(--color-neutral-900));padding:12px">
                <div style="font-size:11px;color:var(--color-neutral-400)">HbA1c</div>
                <div style="font-size:22px;font-weight:600;margin-top:6px;line-height:1">6,8<span style="font-size:11px;font-weight:500;color:var(--color-neutral-300);margin-left:2px">%</span></div>
              </div>
              <div style="border-radius:16px;background:color-mix(in srgb, var(--color-accent) 9%, var(--color-neutral-900));padding:12px">
                <div style="font-size:11px;color:var(--color-neutral-400)">Вес</div>
                <div style="font-size:22px;font-weight:600;margin-top:6px;line-height:1">74<span style="font-size:11px;font-weight:500;color:var(--color-neutral-300);margin-left:2px">кг</span></div>
              </div>
              <div style="border-radius:16px;background:color-mix(in srgb, var(--color-accent) 9%, var(--color-neutral-900));padding:12px">
                <div style="font-size:11px;color:var(--color-neutral-400)">СУИ</div>
                <div style="font-size:22px;font-weight:600;margin-top:6px;line-height:1">1:8</div>
              </div>
            </div>

              <div onClick="{{ toggleBolusRem }}" style="display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:18px;background:var(--color-neutral-900);cursor:pointer">
                <i class="ph-fill ph-bell-ringing" style="font-size:19px;color:var(--color-accent);flex-shrink:0"></i>
                <div style="flex:1;min-width:0">
                  <div style="font-size:14px">Напоминать о болюсе</div>
                  <div style="font-size:11px;color:var(--color-neutral-400);margin-top:2px">перед приёмами пищи</div>
                </div>
                <div style="width:44px;height:26px;border-radius:13px;flex-shrink:0;padding:3px;box-sizing:border-box;background:{{ bolusRemTrack }};transition:background .16s">
                  <div style="width:20px;height:20px;border-radius:50%;background:{{ bolusRemKnob }};transform:{{ bolusRemX }};transition:transform .16s"></div>
                </div>
              </div>

              <div style="font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--color-neutral-500);margin:20px 0 8px">Сколько раз в день</div>
              <div style="display:flex;gap:6px;background:var(--color-neutral-900);border-radius:14px;padding:4px">
                <sc-for list="{{ bolusRemCounts }}" as="c" hint-placeholder-count="5">
                  <div onClick="{{ c.onClick }}" style="flex:1;text-align:center;padding:10px 0;border-radius:11px;cursor:pointer;font-size:13px;font-weight:500;color:{{ c.col }};background:{{ c.bg }}">{{ c.label }}</div>
                </sc-for>
              </div>

              <div style="font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--color-neutral-500);margin:20px 0 8px">Время напоминаний</div>
              <div style="border-radius:18px;overflow:hidden;background:var(--color-neutral-900)">
                <sc-for list="{{ bolusRemTimes }}" as="t" hint-placeholder-count="3">
                  <div style="display:flex;align-items:center;gap:12px;padding:13px 15px;border-bottom:1px solid var(--color-neutral-800);cursor:pointer" style-hover="background:color-mix(in srgb, var(--color-accent) 10%, transparent)">
                    <div style="font-size:15px;font-weight:600;min-width:48px;color:{{ t.col }}">{{ t.time }}</div>
                    <div style="flex:1;min-width:0;font-size:13px;color:var(--color-neutral-300)">{{ t.label }}</div>
                    <i class="ph-bold ph-caret-right" style="font-size:14px;color:var(--color-neutral-600)"></i>
                  </div>
                </sc-for>
              </div>

              <div style="border-radius:18px;overflow:hidden;background:var(--color-neutral-900);margin-top:12px">
                <div onClick="{{ toggleRemMissed }}" style="display:flex;align-items:center;gap:12px;padding:13px 15px;cursor:pointer">
                  <i class="ph-fill ph-clock-countdown" style="font-size:19px;color:var(--color-accent);flex-shrink:0"></i>
                  <div style="flex:1;min-width:0">
                    <div style="font-size:14px">Если болюс не записан</div>
                    <div style="font-size:11px;color:var(--color-neutral-400);margin-top:2px">повторить через 30 мин</div>
                  </div>
                  <div style="width:44px;height:26px;border-radius:13px;flex-shrink:0;padding:3px;box-sizing:border-box;background:{{ remMissedTrack }};transition:background .16s">
                    <div style="width:20px;height:20px;border-radius:50%;background:{{ remMissedKnob }};transform:{{ remMissedX }};transition:transform .16s"></div>
                  </div>
                </div>
              </div>

            </div>
          </div>
        </div>
      </sc-if>

      <!-- ================= ШТОРКА «NIGHTSCOUT» ================= -->
      <sc-if value="{{ isNsSheet }}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:flex-end">
          <div onClick="{{ closeSheet }}" style="position:absolute;inset:0;background:color-mix(in srgb, var(--c-scrim) 58%, transparent);backdrop-filter:blur(3px)"></div>
          <div style="position:relative;max-height:92%;display:flex;flex-direction:column;border-radius:28px 28px 0 0;background:var(--color-bg);border-top:1px solid var(--color-neutral-800);box-shadow:0 -1px 0 color-mix(in srgb, var(--color-neutral-100) 8%, transparent), 0 -24px 56px color-mix(in srgb, var(--c-scrim) 55%, transparent);animation:sheetUp .34s cubic-bezier(.2,1.02,.28,1)">
            <div style="display:flex;justify-content:center;padding:10px 0 2px;flex-shrink:0">
              <div onClick="{{ closeSheet }}" style="width:44px;height:5px;border-radius:3px;background:var(--color-neutral-700);cursor:pointer"></div>
            </div>
            <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 18px 4px;flex-shrink:0">
              <div style="font-size:19px;font-weight:600;letter-spacing:-.01em">Nightscout</div>
              <button type="button" onClick="{{ closeSheet }}" aria-label="Закрыть" style="width:36px;height:36px;border-radius:50%;border:1px solid var(--color-neutral-800);cursor:pointer;display:flex;align-items:center;justify-content:center;background:var(--color-neutral-900);color:var(--color-neutral-300)" style-hover="background:color-mix(in srgb, var(--color-accent) 18%, var(--color-neutral-900))">
                <i class="ph-bold ph-x" style="font-size:15px"></i>
              </button>
            </div>
            <div class="noscroll" style="overflow:auto;padding:8px 18px 26px">
              <div style="font-size:13px;color:var(--color-neutral-400);line-height:1.5;margin-bottom:16px">Читаем сахар и тренд напрямую из вашего Nightscout. Только чтение. Адрес и токен хранятся локально на устройстве.</div>

              <div style="font-size:11px;color:var(--color-neutral-500);margin:0 2px 6px;text-transform:uppercase;letter-spacing:.08em">Адрес сайта</div>
              <div style="display:flex;align-items:center;gap:8px;border:1px solid var(--color-neutral-800);border-radius:14px;padding:12px 14px;background:var(--color-neutral-900);margin-bottom:14px">
                <i class="ph ph-link" style="font-size:17px;color:var(--color-neutral-500);flex-shrink:0"></i>
                <input value="{{ nsUrl }}" onChange="{{ onNsUrl }}" inputmode="url" placeholder="https://ваш-сайт.nightscout…" style="flex:1;min-width:0;background:transparent;border:0;outline:none;color:var(--color-text);font-size:14px;font-family:var(--font-body)">
              </div>

              <div style="font-size:11px;color:var(--color-neutral-500);margin:0 2px 6px;text-transform:uppercase;letter-spacing:.08em">Токен доступа · если требуется</div>
              <div style="display:flex;align-items:center;gap:8px;border:1px solid var(--color-neutral-800);border-radius:14px;padding:12px 14px;background:var(--color-neutral-900);margin-bottom:18px">
                <i class="ph ph-key" style="font-size:17px;color:var(--color-neutral-500);flex-shrink:0"></i>
                <input value="{{ nsToken }}" onChange="{{ onNsToken }}" placeholder="read-only токен (необязательно)" style="flex:1;min-width:0;background:transparent;border:0;outline:none;color:var(--color-text);font-size:14px;font-family:var(--font-body)">
              </div>

              <button type="button" onClick="{{ nsSave }}" style="width:100%;padding:15px;border-radius:16px;border:1px solid var(--color-accent);background:color-mix(in srgb, var(--color-accent) 14%, transparent);color:var(--color-text);font-size:15px;font-weight:600;font-family:var(--font-body);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px" style-hover="background:color-mix(in srgb, var(--color-accent) 24%, transparent)">
                <i class="ph-bold ph-plugs-connected" style="font-size:19px"></i>Проверить и подключить
              </button>

              <div style="min-height:18px;font-size:13px;color:var(--color-neutral-300);margin-top:12px;text-align:center">{{ nsMsg }}</div>

              <div style="display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;background:var(--color-neutral-900);margin-top:8px">
                <i class="ph-fill ph-cloud-arrow-down" style="font-size:19px;color:var(--color-accent);flex-shrink:0"></i>
                <div style="flex:1;min-width:0">
                  <div style="font-size:14px">Синхронизация</div>
                  <div style="font-size:11px;color:var(--color-neutral-400);margin-top:2px">{{ nsStatusText }}</div>
                </div>
                <div onClick="{{ nsToggle }}" style="width:44px;height:26px;border-radius:13px;background:{{ nsTrack }};position:relative;cursor:pointer;flex-shrink:0;transition:background .18s">
                  <div style="position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:{{ nsKnob }};transform:{{ nsKnobX }};transition:transform .18s"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </sc-if>

      <!-- ================= НИЖНЯЯ ПАНЕЛЬ ================= -->
      <div style="padding:10px 8px max(30px, calc(env(safe-area-inset-bottom) + 12px));border-top:1px solid var(--color-neutral-800);background:color-mix(in srgb, var(--color-neutral-900) 70%, var(--color-bg));display:flex;justify-content:space-around;align-items:flex-start">
        <sc-for list="{{ nav }}" as="n" hint-placeholder-count="5">
          <div onClick="{{ n.onClick }}" style="display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;flex:1;padding-top:4px">
            <i class="{{ n.iconClass }}" style="font-size:{{ n.iconSize }};color:{{ n.col }}"></i>
            <div style="font-size:{{ n.labelSize }};font-weight:{{ n.labelWeight }};color:{{ n.col }}">{{ n.label }}</div>
          </div>
        </sc-for>
      </div>

    </div>

</template>
<script src="engine.js"></script>
<script src="nightscout.js"></script>
<script src="store.js"></script>
<script src="app.js"></script>
</body>
</html>
