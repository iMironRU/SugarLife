name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build Ionic app (v2)
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: Place v2 into site
        run: |
          rm -rf prototypes/v2
          cp -r app/dist prototypes/v2

      # OTA-бандл для нативки (Capgo): отдельная сборка с ОТНОСИТЕЛЬНЫМ base (CAP=1),
      # т.к. в webview нет пути /SugarLife/v2/. Пакуем в zip + манифест на тех же Pages.
      - name: Build OTA bundle (relative base)
        working-directory: app
        env:
          CAP: '1'
        run: npm run build

      - name: Package OTA bundle + manifest
        run: |
          SHA=$(git rev-parse --short HEAD)
          VER=$(node -p "require('./app/package.json').version")
          mkdir -p prototypes/v2/ota
          (cd app/dist && zip -qr "../../prototypes/v2/ota/bundle-$SHA.zip" .)
          cat > prototypes/v2/ota/manifest.json <<EOF
          { "build": "$SHA", "version": "$VER-$SHA", "url": "https://imiron.ru/SugarLife/v2/ota/bundle-$SHA.zip" }
          EOF
          echo "OTA manifest:"; cat prototypes/v2/ota/manifest.json

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: prototypes

      - id: deployment
        uses: actions/deploy-pages@v4
