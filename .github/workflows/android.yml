name: Android APK

# АВТОСБОРКА ВЕРНУЛАСЬ, НО ДЕРЖИТСЯ НА СЕКРЕТЕ (#133).
#
# Что мешало. app/android/settings.gradle подключает KMP-движок composite-сборкой по
# пути к клону ПРИВАТНОГО SugarLifeCore. Исходников движка в этом репозитории нет и не
# будет, а зависимость ru.imiron.sugarlife:engine объявлена без версии и разрешается
# только этой подстановкой — на раннере сборка падала на конфигурации за семь секунд.
#
# Что изменилось. Ядро чекается сюда же, в core/, по токену из секрета CORE_REPO_TOKEN,
# и путь передаётся через SUGARLIFE_CORE_DIR — ровно тот способ, который settings.gradle
# и предусматривает.
#
# ПОЧЕМУ БЕЗ СЕКРЕТА МЫ НЕ ПАДАЕМ, А ПРОПУСКАЕМ. Красный CI на каждом merge перестают
# читать, а вместе с ним перестают читать настоящие падения — ровно поэтому автозапуск
# когда-то и выключили целиком. Пропущенный шаг честнее: он не врёт про поломку и не
# приучает игнорировать красное.
#
# Подпись берётся из репозитория (android/sugarlife-debug.keystore), поэтому APK из CI
# и собранный руками подписаны одинаково — обновление ставится поверх, не стирая записи
# человека. Это не мелочь: данные в MVP живут только на телефоне.
#
# Долгосрочно правильнее публикация AAR (SugarLifeCore#24): тогда токен и чекаут чужого
# репозитория не нужны вовсе, а наша сборка перестаёт зависеть от того, что прямо сейчас
# лежит в main у соседей.
on:
  push:
    branches: [main]
  workflow_dispatch:        # запуск вручную (Actions → Android APK → Run workflow)

concurrency:                # не копить параллельные сборки — оставляем последнюю
  group: android-apk
  cancel-in-progress: true

permissions:
  contents: write           # нужно для публикации в Releases

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Секрет в `if` шага напрямую не читается, поэтому кладём его в env один раз.
      # Имя латиницей вынужденно: GitHub Actions допускает в именах переменных только
      # ASCII, и на кириллическом файл не парсится вовсе — падает весь workflow, без задач.
      HAS_CORE_TOKEN: ${{ secrets.CORE_REPO_TOKEN != '' && 'да' || 'нет' }}
    steps:
      - name: Есть ли доступ к ядру
        run: |
          if [ "$HAS_CORE_TOKEN" = "нет" ]; then
            echo "::notice::Секрета CORE_REPO_TOKEN нет — APK не собирается. Движок лежит в приватном SugarLifeCore, без доступа к нему сборка невозможна (#133)."
          fi

      - uses: actions/checkout@v4
        if: env.HAS_CORE_TOKEN == 'да'

      # Ядро кладём рядом; settings.gradle читает путь из SUGARLIFE_CORE_DIR.
      #
      # Берём ИМЕННО main, а не ветку по умолчанию. У соседей ветка по умолчанию —
      # docs/connect-ux-handoff, и она отстаёт: main на дюжину коммитов впереди и ни на
      # один позади. На этом мы и встали — submitScanReadiness есть в main, в ветке по
      # умолчанию его нет, и APK перестал собираться сразу после слияния нашего #336.
      # Локально при этом всё собиралось: клон ядра на машине стоял на свежей ветке.
      #
      # Ветка по умолчанию — не то же самое, что «текущее состояние ядра», и полагаться
      # на неё как на источник значит зависеть от чужой настройки репозитория, о которой
      # мы даже не узнаем, когда её поменяют. Пока AAR не публикуется (SugarLifeCore#24),
      # называем ветку явно — это хотя бы видно в diff.
      - name: Checkout SugarLifeCore
        if: env.HAS_CORE_TOKEN == 'да'
        uses: actions/checkout@v4
        with:
          repository: iMironRU/SugarLifeCore
          ref: main
          token: ${{ secrets.CORE_REPO_TOKEN }}
          path: core

      - uses: actions/setup-java@v4
        if: env.HAS_CORE_TOKEN == 'да'
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        if: env.HAS_CORE_TOKEN == 'да'
        with:
          node-version: '22'

      # ЧУЖОЙ КОД НЕ УЕЗЖАЕТ В РЕЛИЗ (#439).
      #
      # Двадцать две тысячи строк под GPL-3.0 однажды доехали до опубликованного APK
      # внутри коммита про уведомления, и заметили это только через сутки, на ревью
      # следующего PR. Человеческая внимательность на дифах такого размера не работает:
      # большой диф не читают, его пролистывают.
      #
      # Проверка стоит ДО сборки и валит её: релиз с чужой лицензией отозвать нельзя —
      # его уже скачали. Владелец решил, что калибровка остаётся личной, и здесь это
      # решение исполняется, а не повторяется словами.
      - name: Чужого кода в дереве нет
        if: env.HAS_CORE_TOKEN == 'да'
        run: |
          НАЙДЕНО=$(find app -type d -name vendor -not -path '*/node_modules/*' | head -5)
          if [ -n "$НАЙДЕНО" ]; then
            echo "::error::Чужой код в дереве: $НАЙДЕНО. Он не должен попадать в репозиторий и в релиз (#439)."
            exit 1
          fi
          ЛИЦЕНЗИИ=$(grep -rlE 'GNU GPL|GPL-3\.0|General Public License' app/android/app/src app/ios/App/App app/src 2>/dev/null | head -5 || true)
          if [ -n "$ЛИЦЕНЗИИ" ]; then
            echo "::error::Файлы под GPL в наших исходниках: $ЛИЦЕНЗИИ (#439)."
            exit 1
          fi
          echo "чужого кода не найдено"

      - name: Build web (relative base for native)
        if: env.HAS_CORE_TOKEN == 'да'
        working-directory: app
        env:
          CAP: '1'
        run: |
          npm ci
          npm run build

      - name: Capacitor sync (android)
        if: env.HAS_CORE_TOKEN == 'да'
        working-directory: app
        run: npx cap sync android

      - name: Setup Android SDK
        if: env.HAS_CORE_TOKEN == 'да'
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        if: env.HAS_CORE_TOKEN == 'да'
        run: yes | sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" >/dev/null 2>&1 || true

      # ИЗДАНИЯ (core#61): после введения флейворов задачи `assembleDebug` больше нет — есть
      # assembleLiteDebug и assembleProDebug. Релиз выпускает ИМЕННО Lite: это издание стоит у людей,
      # и обновление обязано доходить до них, а не подменяться пакетом .pro.
      - name: Build debug APK (Lite)
        if: env.HAS_CORE_TOKEN == 'да'
        working-directory: app/android
        env:
          # Путь к чекауту ядра: ровно та переменная, которую ищет settings.gradle.
          SUGARLIFE_CORE_DIR: ${{ github.workspace }}/core
        run: |
          chmod +x gradlew
          ./gradlew assembleLiteDebug --no-daemon --stacktrace

      - name: Rename APK
        if: env.HAS_CORE_TOKEN == 'да'
        run: cp app/android/app/build/outputs/apk/lite/debug/app-lite-debug.apk sugarlife-debug.apk

      - name: Upload artifact
        if: env.HAS_CORE_TOKEN == 'да'
        uses: actions/upload-artifact@v4
        with:
          name: sugarlife-debug-apk
          path: sugarlife-debug.apk

      # Строка «build:» — не украшение: по ней приложение решает, предлагать ли
      # «Скачать APK» (src/platform/appUpdate.ts, #238). Формат менять нельзя.
      - name: Publish to Releases
        if: env.HAS_CORE_TOKEN == 'да'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'android-latest' }}
          name: SugarLife.Lite (debug)
          prerelease: true
          files: sugarlife-debug.apk
          body: |
            Debug-сборка «SugarLife.Lite» для тестов на Android.

            build: ${{ github.sha }}

            Установка: скачай `sugarlife-debug.apk` → на телефоне разреши установку
            из неизвестных источников → открой файл. Записи и настройки при обновлении
            поверх остаются: подпись та же, что у сборок с руки. Не для продакшена.
