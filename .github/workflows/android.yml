name: Android APK

# АВТОЗАПУСК ВЫКЛЮЧЕН — см. issue #133 (там же условия возврата).
#
# Почему. С коммита 82e2f69 (реинтеграция движка) app/android/settings.gradle
# подключает KMP-движок composite-сборкой по АБСОЛЮТНОМУ пути к локальному клону
# приватного SugarLifeCore. На раннере такого пути нет и быть не может: исходников
# движка в этом репозитории никогда не было, а зависимость ru.imiron.sugarlife:engine
# объявлена без версии и разрешается только этой подстановкой. Сборка падает на
# конфигурации, за семь секунд, не дойдя до компиляции.
#
# Зачем выключать, а не оставить красным. Красный CI на каждый мерж перестают читать —
# и вместе с ним перестают читать настоящие падения. Работаем сейчас в PWA; Pages
# (/v2/, /v2-preview/, OTA-бандл) собираются отдельным workflow, движок им не нужен.
#
# Ручной запуск оставлен намеренно: когда движок станет доступен раннеру (публикация
# AAR либо чекаут ядра по токену), проверить это можно будет одной кнопкой, не трогая
# файл. Пока он будет падать так же — это ожидаемо.
on:
  workflow_dispatch:        # запуск вручную (Actions → Android APK → Run workflow)

concurrency:                # не копить параллельные сборки — оставляем последнюю
  group: android-apk
  cancel-in-progress: true

permissions:
  contents: write           # нужно для публикации в Releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build web (relative base for native)
        working-directory: app
        env:
          CAP: '1'
        run: |
          npm ci
          npm run build

      - name: Capacitor sync (android)
        working-directory: app
        run: npx cap sync android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: yes | sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" >/dev/null 2>&1 || true

      - name: Build debug APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/android/app/build/outputs/apk/debug/app-debug.apk sugarlife-debug.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sugarlife-debug-apk
          path: sugarlife-debug.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'android-latest' }}
          name: SugarLife Android (debug)
          prerelease: true
          files: sugarlife-debug.apk
          body: |
            Debug-сборка «СладкаяЖизнь» для тестов на Android.

            build: ${{ github.sha }}

            Установка: скачай `sugarlife-debug.apk` → на телефоне разреши установку
            из неизвестных источников → открой файл. Не для продакшена.
