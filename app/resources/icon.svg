<!-- Иконка приложения. Источник для iOS, Android и PWA — рисуется скриптом scripts/make-icons.sh.
     Без скруглений: углы срезает сама система, и своё скругление поверх системного даёт
     двойную рамку. Капля занимает ~79 % высоты плитки — на домашнем экране она стоит рядом
     с чужими иконками, и глыф меньше соседских читается как «приложение поменьше» (SugarLife#160). -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="drop" x1="256" y1="104" x2="256" y2="412" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e6e2ff"/>
      <stop offset="0.45" stop-color="#b7aef0"/>
      <stop offset="1" stop-color="#8375d3"/>
    </linearGradient>
    <radialGradient id="bg" cx="256" cy="200" r="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22243a"/>
      <stop offset="1" stop-color="#161826"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(256 256) scale(1.257) translate(-256 -275)">
    <path d="M256 104 C256 104 372 250 372 330 a116 116 0 1 1 -232 0 C140 250 256 104 256 104 Z" fill="#9184d9" opacity="0.22" filter="url(#glow)"/>
    <path d="M256 104 C256 104 372 250 372 330 a116 116 0 1 1 -232 0 C140 250 256 104 256 104 Z" fill="url(#drop)"/>
    <ellipse cx="212" cy="292" rx="30" ry="52" fill="#ffffff" opacity="0.28" transform="rotate(-24 212 292)"/>
    <path d="M176 344 h34 l16 -40 l22 78 l20 -58 l14 20 h30" fill="none" stroke="#161826" stroke-width="15"
          stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  </g>
</svg>
