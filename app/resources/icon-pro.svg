<!-- Иконка издания Pro (core#61). Тот же силуэт капли, что у Lite: это одно приложение в двух редакциях,
     и подменять узнаваемый глиф было бы враньём. Отличают два независимых признака, потому что одного мало:
     цвет не читается у людей с нарушением цветовосприятия, а метка теряется на мелких плотностях.
       * гамма — стальная/бирюзовая вместо сиреневой;
       * метка PRO внизу.
     Оба приложения стоят на одном телефоне рядом, и различать их надо с одного взгляда, не читая подписи. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="drop" x1="256" y1="104" x2="256" y2="412" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#dff6ff"/>
      <stop offset="0.45" stop-color="#8fd3e8"/>
      <stop offset="1" stop-color="#3f8fb0"/>
    </linearGradient>
    <radialGradient id="bg" cx="256" cy="200" r="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1b2a33"/>
      <stop offset="1" stop-color="#0f171d"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- ВНЕШНЯЯ группа: композиция целиком, вместе со значком PRO. Под маску Android
       обязано влезать всё видимое, а не одна капля — иначе значок срежет первым. -->
  <g transform="translate(256 256) scale(1.182) translate(-256 -256)">
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Капля чуть выше, чем у Lite: внизу освобождается место под метку, а размер глифа не уменьшается. -->
  <g>
    <path d="M256 104 C256 104 372 250 372 330 a116 116 0 1 1 -232 0 C140 250 256 104 256 104 Z" fill="#5fb3cf" opacity="0.22" filter="url(#glow)"/>
    <path d="M256 104 C256 104 372 250 372 330 a116 116 0 1 1 -232 0 C140 250 256 104 256 104 Z" fill="url(#drop)"/>
    <ellipse cx="212" cy="292" rx="30" ry="52" fill="#ffffff" opacity="0.28" transform="rotate(-24 212 292)"/>
    <path d="M176 344 h34 l16 -40 l22 78 l20 -58 l14 20 h30" fill="none" stroke="#0f171d" stroke-width="15"
          stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  </g>
  <!-- Метка. Плашка, а не просто буквы: на пёстрых обоях текст без подложки пропадает. -->
  <g>
    <rect x="176" y="404" width="160" height="62" rx="31" fill="#0f171d" opacity="0.86"/>
    <rect x="176" y="404" width="160" height="62" rx="31" fill="none" stroke="#8fd3e8" stroke-width="4" opacity="0.9"/>
    <text x="256" y="447" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
          font-size="40" font-weight="700" letter-spacing="6" fill="#dff6ff">PRO</text>
  </g>
  </g>
</svg>
