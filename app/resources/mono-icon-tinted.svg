<!-- Ч/Б вариант иконки для сборки SugarLife.Pro: наш билд должен быть отличим от фронтового
     на домашнем экране с одного взгляда. Формы те же, палитра обесцвечена по яркости. -->
<!-- Тонированный вариант для iOS 18. Система красит его в выбранный человеком цвет по яркости,
     поэтому здесь нет собственного цвета вовсе — только светлая капля и тёмный пульс. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512">
  <g transform="translate(256 256) scale(1.18) translate(-256 -275)">
    <path d="M256 104 C256 104 372 250 372 330 a116 116 0 1 1 -232 0 C140 250 256 104 256 104 Z" fill="#ffffff"/>
    <ellipse cx="212" cy="292" rx="30" ry="52" fill="#ffffff" opacity="0.5" transform="rotate(-24 212 292)"/>
    <path d="M176 344 h34 l16 -40 l22 78 l20 -58 l14 20 h30" fill="none" stroke="#000000" stroke-width="15"
          stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  </g>
</svg>
