<!-- Ч/Б вариант иконки для сборки SugarLife.Pro: наш билд должен быть отличим от фронтового
     на домашнем экране с одного взгляда. Формы те же, палитра обесцвечена по яркости. -->
<!-- Тёмный вариант для iOS 18. Подложку система рисует сама, поэтому здесь только капля на
     прозрачном: своя тёмная плитка поверх системной выглядела бы наклейкой. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="drop" x1="256" y1="104" x2="256" y2="412" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f2f2f2"/>
      <stop offset="0.45" stop-color="#c8c8c8"/>
      <stop offset="1" stop-color="#8a8a8a"/>
    </linearGradient>
  </defs>
  <g transform="translate(256 256) scale(1.18) translate(-256 -275)">
    <path d="M256 104 C256 104 372 250 372 330 a116 116 0 1 1 -232 0 C140 250 256 104 256 104 Z" fill="url(#drop)"/>
    <ellipse cx="212" cy="292" rx="30" ry="52" fill="#ffffff" opacity="0.28" transform="rotate(-24 212 292)"/>
    <path d="M176 344 h34 l16 -40 l22 78 l20 -58 l14 20 h30" fill="none" stroke="#101010" stroke-width="15"
          stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  </g>
</svg>
