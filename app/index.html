<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#161826" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="СладкаЯ жизнь" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- ИМЯ ЗДЕСЬ — ЧЕЛОВЕЧЕСКОЕ, А НЕ ИМЯ ИЗДАНИЯ (#813). Стояло «SugarLife.Lite», и оно
         уезжало в Pro-сборку тоже: видно в отладчике на телефоне. Издание выбирается переменной
         сборки, а этот файл один на оба — значит любое имя издания здесь будет наполовину ложью.
         Человеку же нужно то же имя, что на домашнем экране. -->
    <title>СладкаЯ жизнь</title>
    <!-- Сторож запуска: единственный код восстановления вне бандла (#131). Обычным
         скриптом и до модуля — бандл ровно то, что ломается, и ждать его нельзя. -->
    <script src="/boot-guard.js"></script>
    <!-- Демо-приборы и облака. Без ?демо=1 в адресе скрипт не делает ничего (#279). -->
    <script src="/demo-bridge.js"></script>
    <script>
      // Ловим событие установки до монтирования React, чтобы не пропустить его.
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__bip = e;
        window.dispatchEvent(new Event('bip-ready'));
      });
    </script>
    <style>
      html, body { margin: 0; height: 100%; background: #161826; }
      #boot {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 22px;
        background: #161826; color: #e9e9ed; font-family: "Inter", system-ui, sans-serif;
      }
      #boot .b-drop {
        width: 96px; height: 96px;
        filter: drop-shadow(0 0 16px rgba(145, 132, 217, .5));
        /* Число повторов, а не вечность: SugarLife#729 и сторож src/анимации.test.ts. */
        animation: bpulse 1.8s ease-in-out 17;
      }
      @keyframes bpulse {
        0%, 100% { filter: drop-shadow(0 0 12px rgba(145, 132, 217, .35)); transform: scale(1); }
        50% { filter: drop-shadow(0 0 26px rgba(145, 132, 217, .62)); transform: scale(1.045); }
      }
      #boot .b-spin {
        width: 26px; height: 26px; border-radius: 50%;
        border: 3px solid #3f424d; border-top-color: #9184d9;
        animation: bspin .8s linear 38;
      }
      @keyframes bspin { to { transform: rotate(360deg); } }
      #boot .b-title { font-size: 15px; color: #9397ab; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <svg class="b-drop" viewBox="0 0 512 512" aria-hidden="true">
          <defs>
            <linearGradient id="bdrop" x1="256" y1="104" x2="256" y2="412" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#e6e2ff" />
              <stop offset="0.45" stop-color="#b7aef0" />
              <stop offset="1" stop-color="#8375d3" />
            </linearGradient>
          </defs>
          <path d="M256 104 C256 104 372 250 372 330 a116 116 0 1 1 -232 0 C140 250 256 104 256 104 Z" fill="url(#bdrop)" />
          <ellipse cx="212" cy="292" rx="30" ry="52" fill="#ffffff" opacity="0.28" transform="rotate(-24 212 292)" />
          <path d="M176 344 h34 l16 -40 l22 78 l20 -58 l14 20 h30" fill="none" stroke="#161826" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
        </svg>
        <div class="b-spin"></div>
        <div class="b-title" id="b-title">СладкаЯ жизнь</div>
        <!-- Перезапуск ради обновления выглядел как обычный старт: экран моргал, появлялась
             заставка, и человек оказывался не там, где был, — без единого слова о том, что
             произошло (#398). Отметку ставит приложение ПЕРЕД перезагрузкой; читаем её здесь,
             до бандла, потому что бандла в этот момент ещё нет. -->
        <script>
          (function () {
            try {
              if (localStorage.getItem('sl.justUpdated.v1')) {
                document.getElementById('b-title').textContent = 'Обновляюсь…';
              }
            } catch (e) { /* приватный режим — просто обычная заставка */ }
          })();
        </script>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
