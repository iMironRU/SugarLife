apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'   // Kotlin для нативного плагина-моста (KMP-движок)

android {
    namespace = "ru.imiron.sugarlife"
    compileSdk = rootProject.ext.compileSdkVersion
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions { jvmTarget = "21" }   // совпасть с Java-задачами Capacitor (иначе рассинхрон JVM-target)
    defaultConfig {
        applicationId "ru.imiron.sugarlife.pro"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "0.3.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        // Постоянный debug-ключ в репо → все сборки подписаны одинаково,
        // и обновления ставятся поверх без удаления приложения.
        // Это НЕ релизный ключ, хранить его в репозитории безопасно.
        debug {
            storeFile file('../sugarlife-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    // ИЗДАНИЯ (SugarLife#296, core#61). Разъезжаются СБОРКОЙ, а не правкой общих файлов: применение
    // «переименовать приложение в репозитории» превращало единственное издание в другое — у всех, кто
    // поставил Lite, обновление перестало бы приходить, потому что рядом встал бы другой пакет с пустой
    // историей. Здесь же общие файлы не отличаются между изданиями вовсе.
    //
    // lite — только чтение. pro — ещё и управление помпой; ядро в pro собирается с -Pedition=pro
    // (см. ../build-engine.sh), и кода отправки команд в lite-артефакте нет физически.
    // Издание ЯДРА задаётся свойством Gradle (-Pedition), потому что движок подключён composite-сборкой и
    // резолвится один раз на запуск: собрать оба APK одной командой нельзя. Чтобы «Pro с ядром Lite» не
    // случился молча — падаем сразу и объясняем. Молчаливо собранный Pro без пульта отладить намного дороже.
    gradle.taskGraph.whenReady { graph ->
        def buildsPro = graph.allTasks.any { it.name ==~ /(?i).*(assemble|bundle|install)Pro(Debug|Release)?/ }
        def edition = (project.findProperty('edition') ?: 'lite').toString().toLowerCase()
        if (buildsPro && edition != 'pro') {
            throw new GradleException(
                "Издание Pro собирается с ядром '$edition'. Ядро выбирается отдельно, потому что оно " +
                "подключено composite-сборкой:\n  ./gradlew assembleProDebug -Pedition=pro\n" +
                "А Lite собирается без флага: ./gradlew assembleLiteDebug")
        }
        if (!buildsPro && edition == 'pro' && graph.allTasks.any { it.name ==~ /(?i).*(assemble|bundle|install)Lite(Debug|Release)?/ }) {
            throw new GradleException(
                "Издание Lite собирается с ядром pro: в Lite не должно быть кода управления помпой. " +
                "Уберите -Pedition=pro.")
        }

        // Третье место, где издание можно забыть, — ВЕБ-конфиг: его пишет `cap sync` по SUGARLIFE_EDITION,
        // отдельно от Gradle. Без этой проверки собирался Pro-пакет с appId Lite внутри (нашли на ревью
        // #297): снаружи .pro, внутри — Lite. Сверяем то, что реально попадёт в APK.
        def buildsLite = graph.allTasks.any { it.name ==~ /(?i).*(assemble|bundle|install)Lite(Debug|Release)?/ }
        if (buildsPro || buildsLite) {
            def cfg = file('src/main/assets/capacitor.config.json')
            def wanted = buildsPro ? 'ru.imiron.sugarlife.pro' : 'ru.imiron.sugarlife'
            if (!cfg.exists()) {
                throw new GradleException(
                    "Нет $cfg — веб-часть не разложена. Сначала:\n" +
                    "  cd app && SUGARLIFE_EDITION=${buildsPro ? 'pro' : 'lite'} npx cap sync android")
            }
            def got = (cfg.text =~ /"appId"\s*:\s*"([^"]+)"/)
            def actual = got ? got[0][1] : '(нет appId)'
            if (actual != wanted) {
                throw new GradleException(
                    "Веб-конфиг от другого издания: в APK попал appId '$actual', а собирается '$wanted'.\n" +
                    "Пересоберите веб под нужное издание:\n" +
                    "  cd app && SUGARLIFE_EDITION=${buildsPro ? 'pro' : 'lite'} npx cap sync android")
            }
        }
    }

    flavorDimensions "edition"
    productFlavors {
        lite {
            dimension "edition"
            // Идентификатор НЕ трогаем: это издание, которое уже стоит у людей, и обновление обязано дойти.
        }
        pro {
            dimension "edition"
            applicationIdSuffix ".pro"
            // Своё имя и своя иконка лежат в src/pro/ — рядом, а не поверх общих.
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    implementation "ru.imiron.sugarlife:engine"   // KMP-движок (composite build, android release)
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
