ext {
    /* Android 8.0 (#299). Было 24 — Android 7.0, но эта цифра ничего не обещала: расширенная
       реклама BLE-5 (ScanSettings.setLegacy(false)) появилась только в API 26, а именно так
       рекламируется сенсор GS1 (core#30). На Android 7 он не находится в принципе — при любых
       разрешениях и любом коде.

       Оставить 24 значило бы пустить человека в приложение, которое ставится, показывает
       облачные данные и не находит его сенсор, — и всё это без единого объяснения. Отказ при
       установке честнее: он говорит правду сразу и не тратит вечер на поиск поломки в сенсоре.

       Ядро и Capacitor держат свои 24 — здесь мы поднимаем СВОЙ пол, это разрешено и их не
       трогает. Опустить ниже 24 нельзя: цифру независимо задают восемь модулей ядра и
       умолчание Capacitor 8. */
    minSdkVersion = 26
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
}